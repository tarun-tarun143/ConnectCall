name: connect_call
description: "ConnectCall - a Flutter 1-to-1 and group audio/video calling app."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter

  # Flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_messaging: ^16.6.0

  # State management
  flutter_riverpod: ^3.4.3

  # Device / permissions
  permission_handler: ^12.0.1
  connectivity_plus: ^6.1.5

  # ZEGOCLOUD
  zego_uikit: ^2.28.47
  zego_uikit_prebuilt_call: ^4.24.4
  zego_uikit_signaling_plugin: ^2.8.21

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true