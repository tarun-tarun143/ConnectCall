org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
android.enableJetifier=true

# Avoid Android DSL migration issues for now.
android.newDsl=false
android.builtInKotlin=false

# Fix Kotlin incremental-cache failures when the project is
# on F: while Pub packages are cached on C:.
kotlin.incremental=false

# Compile Kotlin inside the Gradle process instead of using
# the Kotlin daemon.
kotlin.compiler.execution.strategy=in-process